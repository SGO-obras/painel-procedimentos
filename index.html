async function migrarProcedimentosDaObra(obraId) {
  if (!usuario || !obraId) return;

  const { data: linhas, error } = await supabaseClient
    .from("procedimentos")
    .select("id,obra_id,user_id,disciplina,procedimento,concluido,atualizado_em")
    .eq("obra_id", obraId)
    .eq("user_id", usuario.id);

  if (error) {
    console.error("Erro ao verificar a migração dos procedimentos:", error);
    throw new Error("Não foi possível verificar a atualização dos procedimentos.");
  }

  const registros = linhas || [];
  const processados = new Set();

  for (const linha of registros) {
    const destinos = MIGRACAO_PROCEDIMENTOS[linha.disciplina] &&
      MIGRACAO_PROCEDIMENTOS[linha.disciplina][linha.procedimento];

    if (!destinos || !destinos.length || processados.has(linha.id)) continue;

    for (let i = 0; i < destinos.length; i++) {
      const destino = destinos[i];
      const alvo = registros.find(function(r) {
        return r.disciplina === linha.disciplina &&
          r.procedimento === destino &&
          r.id !== linha.id;
      });

      if (alvo) {
        if (linha.concluido && !alvo.concluido) {
          const { error: erroAtualizar } = await supabaseClient
            .from("procedimentos")
            .update({ concluido: true, atualizado_em: new Date().toISOString() })
            .eq("id", alvo.id)
            .eq("user_id", usuario.id);
          if (erroAtualizar) throw erroAtualizar;
          alvo.concluido = true;
        }
      } else if (i === 0) {
        const { data: atualizado, error: erroMover } = await supabaseClient
          .from("procedimentos")
          .update({
            procedimento: destino,
            atualizado_em: linha.atualizado_em || new Date().toISOString()
          })
          .eq("id", linha.id)
          .eq("user_id", usuario.id)
          .select("id,obra_id,user_id,disciplina,procedimento,concluido,atualizado_em")
          .maybeSingle();
        if (erroMover) throw erroMover;
        if (atualizado) {
          Object.assign(linha, atualizado);
          processados.add(linha.id);
        }
      } else {
        const { data: inserido, error: erroInserir } = await supabaseClient
          .from("procedimentos")
          .insert({
            obra_id: linha.obra_id,
            user_id: linha.user_id,
            disciplina: linha.disciplina,
            procedimento: destino,
            concluido: !!linha.concluido,
            atualizado_em: linha.atualizado_em || new Date().toISOString()
          })
          .select("id,obra_id,user_id,disciplina,procedimento,concluido,atualizado_em")
          .maybeSingle();

        if (erroInserir) {
          const { data: existente, error: erroBusca } = await supabaseClient
            .from("procedimentos")
            .select("id,concluido")
            .eq("obra_id", obraId)
            .eq("user_id", usuario.id)
            .eq("disciplina", linha.disciplina)
            .eq("procedimento", destino)
            .maybeSingle();
          if (erroBusca || !existente) throw erroInserir;
          if (linha.concluido && !existente.concluido) {
            const { error: erroMerge } = await supabaseClient
              .from("procedimentos")
              .update({ concluido: true, atualizado_em: new Date().toISOString() })
              .eq("id", existente.id)
              .eq("user_id", usuario.id);
            if (erroMerge) throw erroMerge;
          }
        } else if (inserido) {
          registros.push(inserido);
        }
      }
    }

    // Apaga apenas a linha antiga já migrada, nunca registros sem mapeamento.
    if (!processados.has(linha.id)) {
      const { error: erroExcluir } = await supabaseClient
        .from("procedimentos")
        .delete()
        .eq("id", linha.id)
        .eq("user_id", usuario.id);
      if (erroExcluir) throw erroExcluir;
      processados.add(linha.id);
    }
  }
}

let usuario = null;
let perfilAtual = null;
let obraAtual = null;

// ---------- Dados / Supabase ----------
async function getObras(){
  if(!usuario) return [];
  const { data, error } = await supabaseClient
    .from("obras")
    .select("id,nome,observacoes,created_at")
    .eq("user_id", usuario.id)
    .order("created_at", { ascending: true });

  if(error){
    console.error(error);
    throw new Error("Não foi possível carregar as obras.");
  }

  return (data || []).map(function(o){
    return {
      id: o.id,
      nome: o.nome,
      observacoes: o.observacoes || "",
      data: o.created_at ? new Date(o.created_at).toLocaleDateString("pt-BR") : ""
    };
  });
}

async function criarObra(nome){
  // Usa o usuário da sessão atual do Supabase, evitando depender
  // somente da variável global "usuario".
  const sessaoAtual = await supabaseClient.auth.getSession();

  if(sessaoAtual.error){
    console.error("Erro ao obter sessão:", sessaoAtual.error);
    throw new Error("Sua sessão não pôde ser recuperada. Faça login novamente.");
  }

  const usuarioSessao = sessaoAtual.data && sessaoAtual.data.session
    ? sessaoAtual.data.session.user
    : null;

  if(!usuarioSessao){
    throw new Error("Sua sessão expirou. Faça login novamente.");
  }

  usuario = usuarioSessao;

  const { data, error } = await supabaseClient
    .from("obras")
    .insert({
      user_id: usuarioSessao.id,
      nome: nome
    })
    .select("id,nome,observacoes,created_at")
    .single();

  if(error){
    console.error("ERRO AO INSERIR OBRA:", error);
    throw new Error(
      "Não foi possível cadastrar a obra.\n" +
      (error.message || "Verifique as permissões da tabela obras.")
    );
  }

  if(!data){
    throw new Error("A obra foi enviada, mas o Supabase não retornou os dados da obra.");
  }

  return {
    id: data.id,
    nome: data.nome,
    observacoes: data.observacoes || "",
    data: data.created_at ? new Date(data.created_at).toLocaleDateString("pt-BR") : ""
  };
}

async function getEstado(){
  if(!usuario || !obraAtual) return {};

  const { data, error } = await supabaseClient
    .from("procedimentos")
    .select("id,disciplina,procedimento,concluido")
    .eq("obra_id", obraAtual.id)
    .eq("user_id", usuario.id);

  if(error){
    console.error(error);
    throw new Error("Não foi possível carregar os procedimentos.");
  }

  const estado = {};
  (data || []).forEach(function(row){
    // Considera somente os procedimentos atuais da disciplina. Registros antigos
    // sem correspondência permanecem preservados no banco, mas não distorcem o percentual.
    if(!DISCIPLINAS[row.disciplina] ||
       DISCIPLINAS[row.disciplina].indexOf(row.procedimento) === -1) return;
    if(!estado[row.disciplina]) estado[row.disciplina] = [];
    if(row.concluido) estado[row.disciplina].push(row.procedimento);
  });

  return estado;
}

async function garantirProcedimentosDaObra(obraId){
  const registros = [];

  Object.keys(DISCIPLINAS).forEach(function(d){
    DISCIPLINAS[d].forEach(function(item){
      registros.push({
        obra_id: obraId,
        user_id: usuario.id,
        disciplina: d,
        procedimento: item,
        concluido: false
      });
    });
  });

  const { error } = await supabaseClient
    .from("procedimentos")
    .upsert(registros, {
      onConflict: "obra_id,disciplina,procedimento",
      ignoreDuplicates: true
    });

  if(error){
    console.error(error);
    throw new Error("Não foi possível preparar os procedimentos da obra.");
  }
}

  const { error } = await supabaseClient
    .from("procedimentos")
    .update({ concluido: concluido, atualizado_em: new Date().toISOString() })
    .eq("obra_id", obraAtual.id)
    .eq("user_id", usuario.id)
    .eq("disciplina", disciplina)
    .eq("procedimento", procedimento);

  if(error){
    console.error(error);
    throw new Error("Não foi possível salvar a alteração.");
  }
}

async function carregarSessao(){
  const { data, error } = await supabaseClient.auth.getSession();
  if(error) console.error(error);

  if(data && data.session){
    usuario = data.session.user;
    await carregarPerfil();
    document.getElementById("hdr-user").textContent =
      (perfilAtual && perfilAtual.role === "coordenador" ? "Coordenador: " : "Usuário: ") +
      (usuario.email || "");
    return true;
  }

  return false;
}

async function carregarPerfil(){
  if(!usuario) return null;

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("id,email,nome,role")
    .eq("id", usuario.id)
    .maybeSingle();

  if(error){
    console.error(error);
    throw new Error("Não foi possível carregar o perfil.");
  }

  perfilAtual = data || {
    id: usuario.id,
    email: usuario.email,
    nome: "",
    role: "usuario"
  };

  return perfilAtual;
}

// ---------- Navegação ----------
function showScreen(id){
  // Ao entrar, esconde a tela de login e mostra o aplicativo.
  document.getElementById("tela-login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  // Mostra somente a tela solicitada dentro do aplicativo.
  ["tela-obras","tela-disciplinas","tela-painel","tela-coord"].forEach(function(s){
    document.getElementById(s).classList.add("hidden");
  });

  const tela = document.getElementById(id);
  if(tela) tela.classList.remove("hidden");
}

// ---------- Login ----------
document.getElementById("btn-entrar").addEventListener("click", async function(event){
  if(event) event.preventDefault();

  var email = document.getElementById("login-email").value.trim().toLowerCase();
  var senha = document.getElementById("login-senha").value;
  var erro = document.getElementById("login-erro");
  var btn = document.getElementById("btn-entrar");

  erro.textContent = "";

  if(!email){
    erro.textContent = "Digite seu e-mail.";
    return;
  }

  if(!email.endsWith("@sjc.sp.gov.br")){
    erro.textContent = "Acesso permitido apenas para e-mails @sjc.sp.gov.br";
    return;
  }

  if(!senha){
    erro.textContent = "Digite sua senha.";
    return;
  }

  if(SUPABASE_URL.indexOf("COLE_AQUI") !== -1 ||
     SUPABASE_ANON_KEY.indexOf("COLE_AQUI") !== -1){
    erro.textContent = "Configure primeiro a URL e a chave do Supabase no código.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Entrando...";

  try{
    // Login real no Supabase Auth.
    const resultado = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: senha
    });

    if(resultado.error){
      throw resultado.error;
    }

    // Usa a sessão retornada pelo Auth. Se necessário, confirma a sessão
    // diretamente no cliente antes de continuar.
    var sessao = resultado.data && resultado.data.session;

    if(!sessao){
      const confirmacao = await supabaseClient.auth.getSession();

      if(confirmacao.error){
        throw confirmacao.error;
      }

      sessao = confirmacao.data && confirmacao.data.session;
    }

    if(!sessao || !sessao.user){
      throw new Error("O login foi aceito, mas o Supabase não retornou uma sessão.");
    }

    usuario = sessao.user;

    // Carrega o perfil do usuário autenticado.
    const perfil = await carregarPerfil();

    perfilAtual = perfil || {
      id: usuario.id,
      email: usuario.email || email,
      nome: "",
      role: "usuario"
    };

    document.getElementById("hdr-user").textContent =
      (perfilAtual.role === "coordenador" ? "Coordenador: " : "Usuário: ") +
      (usuario.email || email);

    // Só depois de autenticar e carregar o perfil a aplicação é exibida.
    if(perfilAtual.role === "coordenador"){
      await montarCoord();
      showScreen("tela-coord");
    }else{
      await renderObras();
      showScreen("tela-obras");
    }

  }catch(e){
    console.error("ERRO NO LOGIN:", e);
    erro.textContent = e && e.message
      ? e.message
      : "Não foi possível entrar.";
  }finally{
    btn.disabled = false;
    btn.textContent = "Entrar";
  }
});

document.getElementById("login-senha").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    e.preventDefault();
    document.getElementById("btn-entrar").click();
  }
});

document.getElementById("btn-sair").addEventListener("click", async function(){
  try{
    await supabaseClient.auth.signOut();
  }finally{
    location.reload();
  }
});

// ---------- Obras ----------
document.getElementById("btn-cadastrar").addEventListener("click", async function(event){
  if(event) event.preventDefault();

  var campo = document.getElementById("obra-nome");
  var nome = campo.value.trim();
  var btn = document.getElementById("btn-cadastrar");

  if(!nome){
    alert("Digite o nome da obra antes de cadastrar.");
    campo.focus();
    return;
  }

  btn.disabled = true;
  btn.textContent = "Cadastrando...";

  try{
    await criarObra(nome);
    campo.value = "";
    await renderObras();
  }catch(e){
    console.error("ERRO AO CADASTRAR OBRA:", e);
    alert(e && e.message ? e.message : "Erro ao cadastrar obra.");
  }finally{
    btn.disabled = false;
    btn.textContent = "Cadastrar Obra";
  }
});

document.getElementById("obra-nome").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    e.preventDefault();
    document.getElementById("btn-cadastrar").click();
  }
});

async function renderObras(){
  var box = document.getElementById("lista-obras");
  box.innerHTML = '<p style="color:var(--dim);grid-column:1/-1">Carregando obras...</p>';

  try{
    var obras = await getObras();
    box.innerHTML = "";

    if(!obras.length){
      box.innerHTML = '<p style="color:var(--dim);grid-column:1/-1">Nenhuma obra cadastrada ainda. Use o campo acima para criar a primeira.</p>';
      return;
    }

    obras.forEach(function(o){
      var d = document.createElement("div");
      d.className = "card";
      d.innerHTML = '<span class="ico">🏢</span><h3>' + escapeHtml(o.nome) + '</h3><small>Criada em ' + o.data + '</small>' +
        '<div style="margin-top:14px"><button type="button" class="btn btn-outline btn-excluir-obra" style="padding:7px 12px;font-size:.85rem">Excluir obra</button></div>';
      d.addEventListener("click", async function(){ await abrirObra(o); });
      d.querySelector(".btn-excluir-obra").addEventListener("click", async function(event){
        event.preventDefault();
        event.stopPropagation();
        if(!confirm('Tem certeza de que deseja excluir a obra "' + o.nome.replace(/"/g, '\\"') + '"? Os procedimentos associados também serão excluídos. Esta ação não pode ser desfeita.')) return;
        var btnExcluir = event.currentTarget;
        btnExcluir.disabled = true;
        btnExcluir.textContent = "Excluindo...";
        try{
          const { error } = await supabaseClient
            .from("obras")
            .delete()
            .eq("id", o.id)
            .eq("user_id", usuario.id);
          if(error) throw error;
          if(obraAtual && String(obraAtual.id) === String(o.id)) obraAtual = null;
          await renderObras();
        }catch(e){
          console.error("Erro ao excluir obra:", e);
          alert("Não foi possível excluir a obra. Verifique as permissões de exclusão no Supabase e tente novamente.");
          btnExcluir.disabled = false;
          btnExcluir.textContent = "Excluir obra";
        }
      });
      box.appendChild(d);
    });
  }catch(e){
    console.error(e);
    box.innerHTML = '<p style="color:var(--erro);grid-column:1/-1">Erro ao carregar as obras.</p>';
  }
}

async function abrirObra(o){
  obraAtual = o;
  document.getElementById("titulo-obra").textContent = "Obra: " + o.nome;

  try{
    await migrarProcedimentosDaObra(o.id);
    await garantirProcedimentosDaObra(o.id);

    document.getElementById("obs-diario").value = o.observacoes || "";

    await atualizarDiario();
    showScreen("tela-disciplinas");
  }catch(e){
    alert(e.message || "Erro ao abrir a obra.");
  }
}
document.getElementById("btn-voltar-obras").addEventListener("click", async function(){
  await renderObras();
  showScreen("tela-obras");
});

// ---------- Disciplinas ----------
Array.prototype.forEach.call(document.querySelectorAll("[data-disc]"), function(card){
  card.addEventListener("click", async function(){
    discAtual = card.getAttribute("data-disc");
    document.getElementById("titulo-painel").textContent = discAtual;

    try{
      await renderChecklist();
      showScreen("tela-painel");
    }catch(e){
      alert(e.message || "Erro ao carregar os procedimentos.");
    }
  });
});

document.getElementById("btn-voltar-disc").addEventListener("click", async function(){
  await atualizarDiario();
  showScreen("tela-disciplinas");
});

async function renderChecklist(){
  var estado = await getEstado();
  var feitos = estado[discAtual] || [];
  var box = document.getElementById("checklist");
  box.innerHTML = "";

  DISCIPLINAS[discAtual].forEach(function(item){
    var linha = document.createElement("label");
    linha.className = "item-check";

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = feitos.indexOf(item) !== -1;

    cb.addEventListener("change", async function(){
      cb.disabled = true;
      try{
        await atualizarProcedimento(discAtual, item, cb.checked);
        await atualizarProgresso();
      }catch(e){
        cb.checked = !cb.checked;
        alert(e.message || "Não foi possível salvar a alteração.");
      }finally{
        cb.disabled = false;
      }
    });

    var span = document.createElement("span");
    span.textContent = item;

    linha.appendChild(cb);
    linha.appendChild(span);
    box.appendChild(linha);
  });

  await atualizarProgresso();
}

async function atualizarProgresso(){
  var estado = await getEstado();
  var feitos = (estado[discAtual] || []).length;
  var total = DISCIPLINAS[discAtual].length;
  var pct = Math.round(feitos / total * 100);

  document.getElementById("prog-txt").textContent =
    feitos + " de " + total + " procedimentos concluídos (" + pct + "%)";

  document.getElementById("prog-barra").style.width = pct + "%";
}

// ---------- Diário de Procedimentos ----------
async function atualizarDiario(){
  var estado = await getEstado();
  var html = "";

  Object.keys(DISCIPLINAS).forEach(function(d){
    var total = DISCIPLINAS[d].length;
    var feitos = (estado[d] || []).length;
    var pct = Math.round(feitos / total * 100);
    var tag = pct === 100
      ? '<span class="tag-status tag-ok">CONCLUÍDA</span>'
      : '<span class="tag-status tag-pend">EM ANDAMENTO</span>';

    html += '<p><strong>' + d + '</strong><span>' +
      feitos + '/' + total + ' (' + pct + '%) ' + tag + '</span></p>';

    html += '<div class="barra"><div style="width:' + pct + '%"></div></div>';
  });

  document.getElementById("resumo-diario").innerHTML = html;
}
document.getElementById("obs-diario").addEventListener("blur", async function(){
  try{
    await atualizarObservacoes();
  }catch(e){
    alert(e.message || "Não foi possível salvar as observações.");
  }
});
document.getElementById("btn-exportar").addEventListener("click", async function(){
  if(!obraAtual || !usuario) return;

  try{
    var estado = await getEstado();
    var obs = document.getElementById("obs-diario").value;

    var txt = "DIÁRIO DE PROCEDIMENTOS — SGO\n";
    txt += "Obra: " + obraAtual.nome + "\n";
    txt += "Responsável: " + (usuario.email || "") + "\n";
    txt += "Data: " + new Date().toLocaleDateString("pt-BR") + "\n\n";

    Object.keys(DISCIPLINAS).forEach(function(d){
      var feitos = estado[d] || [];
      var pend = DISCIPLINAS[d].filter(function(i){
        return feitos.indexOf(i) === -1;
      });

      txt += "=== " + d.toUpperCase() + " ===\n";
      txt += "CONCLUÍDOS:\n" +
        (feitos.length ? feitos.map(function(i){ return "  [OK] " + i; }).join("\n") : "  (nenhum)") +
        "\n";

      txt += "PENDENTES:\n" +
        (pend.length ? pend.map(function(i){ return "  [ ] " + i; }).join("\n") : "  (nenhum)") +
        "\n\n";
    });

    txt += "OBSERVAÇÕES DO ENGENHEIRO:\n" +
      (obs || "(sem observações)") + "\n";

    var blob = new Blob(["\ufeff" + txt], { type: "application/msword" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "Diario_de_Procedimentos_" + obraAtual.nome.replace(/\s+/g, "_") + ".doc";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }catch(e){
    alert(e.message || "Não foi possível exportar o diário.");
  }
});

// ---------- Coordenador ----------
async function montarCoord(){
  montarCabecalhoCoord();
  var totalColunasCoord = 2 + Object.keys(DISCIPLINAS).length;
  var corpo = document.getElementById("coord-corpo");
  corpo.innerHTML = '<tr><td colspan="' + totalColunasCoord + '" style="color:var(--dim)">Carregando...</td></tr>';

  const { data: obras, error } = await supabaseClient
    .from("obras")
    .select("id,nome,user_id,created_at")
    .order("created_at", { ascending: true });

  if(error){
    console.error(error);
    corpo.innerHTML = '<tr><td colspan="' + totalColunasCoord + '" style="color:var(--erro)">Erro ao carregar os dados.</td></tr>';
    return;
  }

  if(!obras || !obras.length){
    corpo.innerHTML = '<tr><td colspan="' + totalColunasCoord + '" style="color:var(--dim)">Nenhum usuário com obras cadastradas ainda.</td></tr>';
    return;
  }

  const userIds = Array.from(new Set(obras.map(function(o){ return o.user_id; })));

  const { data: perfis, error: perfisError } = await supabaseClient
    .from("profiles")
    .select("id,email")
    .in("id", userIds);

  if(perfisError){
    console.error(perfisError);
  }

  const emails = {};
  (perfis || []).forEach(function(p){
    emails[p.id] = p.email || "";
  });

  const obraIds = obras.map(function(o){ return o.id; });

  const { data: procedimentos, error: procError } = await supabaseClient
    .from("procedimentos")
    .select("obra_id,disciplina,procedimento,concluido")
    .in("obra_id", obraIds);

  if(procError){
    console.error(procError);
    corpo.innerHTML = '<tr><td colspan="' + totalColunasCoord + '" style="color:var(--erro)">Erro ao carregar o progresso.</td></tr>';
    return;
  }

  const mapa = {};
  (procedimentos || []).forEach(function(p){
    if(!DISCIPLINAS[p.disciplina] ||
       !DISCIPLINAS[p.disciplina].some(function(item) {
         return item === p.procedimento;
       })) return;
    if(!mapa[p.obra_id]) mapa[p.obra_id] = {};
    if(!mapa[p.obra_id][p.disciplina]) mapa[p.obra_id][p.disciplina] = 0;
    if(p.concluido) mapa[p.obra_id][p.disciplina]++;
  });

  corpo.innerHTML = "";

  obras.forEach(function(o){
    const est = mapa[o.id] || {};

    const tds = Object.keys(DISCIPLINAS).map(function(d){
      const pct = Math.round(((est[d] || 0) / DISCIPLINAS[d].length) * 100);
      return "<td>" + pct + "%</td>";
    }).join("");

    corpo.innerHTML +=
      "<tr><td>" + escapeHtml(emails[o.user_id] || o.user_id) +
      "</td><td>" + escapeHtml(o.nome) + "</td>" + tds + "</tr>";
  });
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
// ---------- Inicialização ----------
montarCabecalhoCoord();
(async function(){
  try{
    if(SUPABASE_URL.indexOf("COLE_AQUI") !== -1 || SUPABASE_ANON_KEY.indexOf("COLE_AQUI") !== -1){
      return;
    }

    const entrou = await carregarSessao();

    if(entrou){
      if(perfilAtual && perfilAtual.role === "coordenador"){
        await montarCoord();
        showScreen("tela-coord");
      }else{
        await renderObras();
        showScreen("tela-obras");
      }
    }
  }catch(e){
    console.error("Erro ao restaurar sessão:", e);
  }
})();
